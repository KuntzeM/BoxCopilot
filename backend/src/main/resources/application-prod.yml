
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  session:
    store-type: redis
    timeout: 122400s
  security:
    oauth2:
      client:
        registration:
          nextcloud:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "${VITE_API_BASE_URL}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          nextcloud:
            issuer-uri: ${NEXTCLOUD_URL}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public
    validate-on-migrate: false

frontend:
  url: ${FRONTEND_URL}

# Image Storage
app:
  image:
    storage:
      path: ${APP_IMAGE_STORAGE_PATH:/var/boxcopilot/images}
  admin:
    username: ${ADMIN_USERNAME:admin}
    name: ${ADMIN_NAME:Administrator}

logging:
  level:
    org.springframework: INFO
    # Debug logging of the security packages would put principals, authorizations and token handling into the
    # log file; both stay pinned at INFO in production.
    org.springframework.security: INFO
    com.boxcopilot.backend: INFO
    com.boxcopilot.backend.mcp: INFO
  file:
    path: /app/logs

# Ensure proper behavior behind reverse proxy and cross-site cookies
server:
  # 'native' lets Tomcat's RemoteIpValve resolve the client address, and it honours X-Forwarded-For only for a
  # request that really arrives from one of the internal proxies below. 'framework' trusted every caller, which
  # made the forwarded address - and with it the IP rate limits and the audit log - freely forgeable.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Traefik receives a Docker-assigned address on the compose network, so the trusted set is the private
      # address space rather than one fixed IP. Where the proxy address is known, narrow it with
      # TRUSTED_PROXY_PATTERN. That value is a JAVA REGULAR EXPRESSION, which is what Tomcat matches the
      # address against - CIDR notation such as 10.0.0.0/8 matches nothing and would silently distrust every
      # proxy. The pattern deliberately avoids {n,m} quantifiers: a closing brace would end the placeholder.
      internal-proxies: "${TRUSTED_PROXY_PATTERN:10\\.\\d\\d?\\d?\\.\\d\\d?\\d?\\.\\d\\d?\\d?|192\\.168\\.\\d\\d?\\d?\\.\\d\\d?\\d?|172\\.(1[6-9]|2\\d|3[01])\\.\\d\\d?\\d?\\.\\d\\d?\\d?|127\\.\\d\\d?\\d?\\.\\d\\d?\\d?\\.\\d\\d?\\d?|0:0:0:0:0:0:0:1|::1}"
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

