
spring:
  config:
    activate:
      on-profile: prod
  autoconfigure:
    # Boot 4 dropped spring.session.store-type: every session store on the classpath is configured, so the one
    # not wanted must be excluded. Production keeps its sessions in Redis.
    exclude:
      - org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        registration:
          nextcloud:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_URL}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          nextcloud:
            issuer-uri: ${NEXTCLOUD_URL}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public
    validate-on-migrate: true

frontend:
  url: ${APP_URL}

# Image Storage
app:
  proxy:
    # Default for server.tomcat.remoteip.internal-proxies. A blank TRUSTED_PROXY_PATTERN counts as unset (see
    # TrustedProxyDefault); a Spring placeholder alone would take the empty value literally.
    default-trusted-pattern: "172\\.(1[6-9]|2\\d|3[01])\\.\\d\\d?\\d?\\.\\d\\d?\\d?|127\\.\\d\\d?\\d?\\.\\d\\d?\\d?\\.\\d\\d?\\d?|0:0:0:0:0:0:0:1|::1"
  image:
    storage:
      path: ${APP_IMAGE_STORAGE_PATH:/var/boxcopilot/images}
  admin:
    username: ${ADMIN_USERNAME:admin}
    name: ${ADMIN_NAME:Administrator}

logging:
  level:
    org.springframework: INFO
    # Debug logging of the security packages would put principals, authorizations and token handling into the
    # log file; both stay pinned at INFO in production.
    org.springframework.security: INFO
    com.boxcopilot.backend: INFO
    com.boxcopilot.backend.mcp: INFO
  file:
    path: /app/logs

# Ensure proper behavior behind reverse proxy
server:
  # 'native' lets Tomcat's RemoteIpValve resolve the client address, and it honours X-Forwarded-For only for a
  # request that really arrives from one of the internal proxies below. 'framework' trusted every caller, which
  # made the forwarded address - and with it the IP rate limits and the audit log - freely forgeable.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # The immediate peer is Traefik on the external traefik-proxy network, which gets a Docker-assigned address, so the default is
      # Docker's default address pool (172.16.0.0/12) plus loopback. The pattern must match the traefik-proxy subnet or all
      # clients share one throttle bucket; 10.x and 192.168.x are NOT trusted by default. Where the proxy address is known, narrow it (or, for custom
      # Docker address pools, widen it) with TRUSTED_PROXY_PATTERN. That value is a JAVA REGULAR EXPRESSION, which is what Tomcat matches the
      # address against - CIDR notation such as 10.0.0.0/8 matches nothing and would silently distrust every
      # proxy. The pattern deliberately avoids {n,m} quantifiers: a closing brace would end the placeholder.
      internal-proxies: "${TRUSTED_PROXY_PATTERN:${app.proxy.default-trusted-pattern}}"
  servlet:
    session:
      cookie:
        # The SPA is served from the backend's own origin, so 'lax' suffices. 'none' would only be needed for a SPA
        # on another site; 'strict' would break the OIDC redirect back from Nextcloud.
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: true

