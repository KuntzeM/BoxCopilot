# Test-only overlay: full prod-profile bundle on localhost with a mock OIDC provider standing in for Nextcloud.
# Never use in production. Usage (credentials come from the env file, never from this file):
#   docker compose -p boxpilot-e2e --env-file <e2e.env> -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#   docker compose -p boxpilot-e2e --env-file <e2e.env> -f docker-compose.yml -f docker-compose.e2e.yml down -v
# Browser: http://localhost:8080 (app: SPA + API on one origin), http://oidc.localhost:9090 (mock IdP).
services:
  postgres:
    container_name: boxpilot-e2e-postgres
    volumes: !override
      - e2e-pgdata:/var/lib/postgresql/data

  redis:
    container_name: boxpilot-e2e-redis

  # "oidc.localhost" resolves to 127.0.0.1 in the browser and, through the network alias, to this container
  # from the app - so the issuer URL is the same on both sides, which OIDC discovery requires.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: 9090
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      boxcopilot-network:
        aliases:
          - oidc.localhost

  app:
    container_name: boxpilot-e2e-app
    env_file: !reset []
    # named volumes over image paths that exist and are owned by uid 10001 (see Dockerfile) inherit that ownership
    volumes: !override
      - e2e-images:/var/boxcopilot/images
      - e2e-logs:/app/logs
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Small login-throttle limits so the E2E throttle steps stay quick (production defaults: 10 / 5 / 15m)
      APP_OIDC_AUTO_PROVISION: "true"
      APP_LOGIN_THROTTLE_IP_LIMIT: "8"
      APP_LOGIN_THROTTLE_IP_USER_LIMIT: "5"
      # plain http on localhost: no Strict-Transport-Security
      HSTS_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    networks: !override
      - boxcopilot-network
    depends_on:
      mock-oidc:
        condition: service_started

networks:
  traefik-proxy: !reset null

volumes:
  e2e-pgdata:
  e2e-images:
  e2e-logs:
