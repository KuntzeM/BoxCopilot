server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Basic security headers. nginx drops inherited add_header lines in any location that declares its own,
    # so every location below that adds a header includes this file again.
    include /etc/nginx/conf.d/security-headers.inc;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html names the hashed bundles, so it must be revalidated on every visit
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        # file names carry a content hash
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Proxy API calls to backend service (docker-compose service name: backend)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
