services:
  postgres:
    image: postgres:15.19
    container_name: boxcopilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    networks:
      - boxcopilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.11-alpine
    container_name: boxcopilot-redis
    # the password is read from the environment so it does not appear in the process arguments
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      # REDISCLI_AUTH lets redis-cli in the healthcheck authenticate
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    networks:
      - boxcopilot-network
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: backend
    container_name: boxcopilot-backend
    working_dir: /app
    # Optional hardening: run as the non-root user the image prepares (uid 10001). Needs
    #   mkdir -p logs images && sudo chown -R 10001:10001 logs images
    # BEFORE `docker compose up`; see README. Left off by default so existing root-owned bind mounts keep working.
    # user: "10001:10001"
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./images:/var/boxcopilot/images
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # read by application-prod.yml (spring.data.redis.host/port); the single source for the Redis address
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL}
      NEXTCLOUD_LOGOUT_URL: ${NEXTCLOUD_LOGOUT_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      APP_IMAGE_STORAGE_PATH: /var/boxcopilot/images
    security_opt:
      - no-new-privileges:true
    # runs as root until OP3: DAC_OVERRIDE keeps existing foreign-owned bind mounts writable
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    mem_limit: 1g
    cpus: 2.0
    networks:
      - boxcopilot-network
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.box-backend.entrypoints=http"
      - "traefik.http.routers.box-backend.rule=Host(`${TRAEFIK_BACKEND_HOST}`)"
      - "traefik.http.middlewares.box-backend-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.box-backend.middlewares=box-backend-https-redirect"
      - "traefik.http.routers.box-backend-secure.entrypoints=https"
      - "traefik.http.routers.box-backend-secure.rule=Host(`${TRAEFIK_BACKEND_HOST}`)"
      - "traefik.http.routers.box-backend-secure.tls=true"
      - "traefik.http.routers.box-backend-secure.tls.certresolver=http"
      - "traefik.http.routers.box-backend-secure.service=box-backend"
      - "traefik.http.services.box-backend.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-proxy"


    healthcheck:
      # TCP probe only (bash is in the image, curl is not); start_period covers Flyway + startup.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: boxcopilot-frontend
    environment:
      # rendered into the nginx CSP (connect-src/img-src); must be a bare origin (scheme://host[:port], no path)
      API_ORIGIN: ${VITE_API_BASE_URL}
      # report = Content-Security-Policy-Report-Only, enforce = Content-Security-Policy
      CSP_MODE: ${CSP_MODE:-report}
      # production sits behind Traefik TLS; the e2e overlay (plain http) turns this off
      HSTS_ENABLED: ${HSTS_ENABLED:-true}
    security_opt:
      - no-new-privileges:true
    # nginx (root master, setuid workers, port 80) needs these
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.5
    networks:
      - boxcopilot-network
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.box.entrypoints=http"
      - "traefik.http.routers.box.rule=Host(`${TRAEFIK_FRONTEND_HOST}`)"
      - "traefik.http.middlewares.box-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.box.middlewares=box-https-redirect"
      - "traefik.http.routers.box-secure.entrypoints=https"
      - "traefik.http.routers.box-secure.rule=Host(`${TRAEFIK_FRONTEND_HOST}`)"
      - "traefik.http.routers.box-secure.tls=true"
      - "traefik.http.routers.box-secure.tls.certresolver=http"
      - "traefik.http.routers.box-secure.service=box"
      - "traefik.http.services.box.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-proxy"

    depends_on:
      backend:
        condition: service_healthy

networks:
  boxcopilot-network:
    driver: bridge
  traefik-proxy:
    external: true

