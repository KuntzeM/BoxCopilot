name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly: everything plus the OWASP dependency scan

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Docker is preinstalled on ubuntu-latest (Testcontainers/Postgres tests).
      - run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  backend-security:
    name: Backend (OWASP dependency scan)
    # NVD download is slow and rate-limited: nightly / manual only. Set the NVD_API_KEY secret to speed it up.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ github.run_id }}
          restore-keys: owasp-nvd-
      - run: mvn -B -ntp -Psecurity-scan -DskipTests verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  frontend:
    name: Frontend (typecheck, test, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image (build + SPA in jar)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the single application image
        run: docker build -t boxpilot:ci .
      - name: Check the image ships the SPA and runs as uid 10001
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' boxpilot:ci)" = "10001:10001"
          id=$(docker create boxpilot:ci)
          docker cp "$id:/app/app.jar" "$RUNNER_TEMP/app.jar"
          docker rm "$id" >/dev/null
          unzip -l "$RUNNER_TEMP/app.jar" | grep -q 'BOOT-INF/classes/static/index.html'

  e2e:
    name: E2E (compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Generate throwaway env file
        run: |
          rand() { openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24; }
          ADMIN_PW="$(rand)"
          PG_PW="$(rand)"; REDIS_PW="$(rand)"; CLIENT_SECRET="$(rand)"
          for v in "$ADMIN_PW" "$PG_PW" "$REDIS_PW" "$CLIENT_SECRET"; do echo "::add-mask::$v"; done
          umask 077
          cat > "$RUNNER_TEMP/e2e.env" <<ENV
          POSTGRES_USER=boxuser
          POSTGRES_PASSWORD=$PG_PW
          POSTGRES_DB=boxcopilot
          REDIS_PASSWORD=$REDIS_PW
          SPRING_PROFILES_ACTIVE=prod
          CLIENT_ID=boxpilot-e2e
          CLIENT_SECRET=$CLIENT_SECRET
          NEXTCLOUD_URL=http://oidc.localhost:9090/default
          NEXTCLOUD_LOGOUT_URL=http://oidc.localhost:9090/default/endsession
          APP_URL=http://localhost:8080
          ADMIN_USERNAME=e2eadmin
          ADMIN_PASSWORD=$ADMIN_PW
          ADMIN_NAME=E2E Admin
          TRAEFIK_HOST=box.localhost
          ENV
          echo "E2E_PASSWORD=$ADMIN_PW" >> "$GITHUB_ENV"
          # runner.* is not available in job-level env, so the compose command is exported from here
          echo "COMPOSE=docker compose -p boxpilot-e2e --env-file $RUNNER_TEMP/e2e.env -f docker-compose.yml -f docker-compose.e2e.yml" >> "$GITHUB_ENV"

      - name: Start stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser journey
        working-directory: e2e
        env:
          E2E_USERNAME: e2eadmin
          E2E_OUT: ${{ runner.temp }}/e2e-out
        run: npm test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-out
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  # Single required check for branch protection.
  ci-ok:
    name: CI passed
    if: always()
    needs: [backend, backend-security, frontend, docker, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs.*.result) }}'
          echo '${{ toJSON(needs.*.result) }}' | grep -Eq 'failure|cancelled' && exit 1 || true

  # Sticky PR comment: one comment, updated in place on every run (found via the hidden marker).
  pr-comment:
    name: PR comment
    if: always() && github.event_name == 'pull_request'
    needs: [backend, backend-security, frontend, docker, e2e]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Dependabot/fork PRs get a read-only token: the step then only warns
    steps:
      - name: Post or update comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- boxpilot-ci-report -->'
          icon() { case "$1" in success) echo "✅ Passed";; failure) echo "❌ Failed";; cancelled) echo "🚫 Cancelled";; *) echo "⏭️ Skipped";; esac; }
          row() { printf '| %s | %s |\n' "$1" "$(icon "$(jq -r --arg k "$2" '.[$k].result' <<<"$RESULTS")")"; }
          FAILED=$(jq -r '[to_entries[] | select(.value.result=="failure" or .value.result=="cancelled")] | length' <<<"$RESULTS")
          if [ "$FAILED" -eq 0 ]; then
            HEAD="## ✅ CI passed"; NOTE="All checks are green. Nothing blocks this PR."
          else
            HEAD="## ❌ CI failed"; NOTE="**$FAILED** check(s) need attention. Details and logs are in the [workflow run]($RUN_URL)."
          fi
          {
            echo "$MARKER"
            echo "$HEAD"
            echo
            echo "$NOTE"
            echo
            echo "| Check | Result |"
            echo "| :-- | :-- |"
            row "🧪 Backend: Maven verify (unit, ArchUnit, Testcontainers)" backend
            row "🎨 Frontend: typecheck, tests, build, audit" frontend
            row "🐳 Docker: single image build (SPA in jar)" docker
            row "🌐 E2E: Docker stack + Playwright journey" e2e
            row "🛡️ OWASP dependency scan _(nightly/manual only)_" backend-security
            echo
            echo "<details><summary>Run details</summary>"
            echo
            echo "- Commit: \`${SHA:0:7}\`"
            echo "- Run: [#${GITHUB_RUN_NUMBER}]($RUN_URL) (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- Artifacts (screenshots, test reports) are attached to the run."
            echo
            echo "</details>"
            echo
            echo "<sub>Updated automatically on every push · $(date -u '+%Y-%m-%d %H:%M UTC')</sub>"
          } > body.md
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@body.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md >/dev/null
          fi
